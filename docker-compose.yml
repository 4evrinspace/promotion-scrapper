x-scraper: &scraper
  build: .
  restart: unless-stopped
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    RAW_PRODUCTS_TOPIC: products.raw
    METRICS_PORT: 8001
    SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-600}
    REQUEST_DELAY_SECONDS: ${REQUEST_DELAY_SECONDS:-2}
    SCRAPER_PRODUCT_LIMIT: 20
  depends_on:
    kafka-init:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.9.0
    restart: "on-failure:3"
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic products.raw --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic products.normalized --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: product_monitoring
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "product_monitoring", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  normalizer:
    build: .
    command: python3 -m normalizer.worker
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_PRODUCTS_TOPIC: products.raw
      NORMALIZED_PRODUCTS_TOPIC: products.normalized
      REDIS_URL: redis://redis:6379/0
      METRICS_PORT: 8002
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      catalog-loader:
        condition: service_completed_successfully

  catalog-loader:
    build: .
    restart: "on-failure:3"
    command: python3 -m scripts.catalog_loader /app/catalog/catalog.jsonl
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./catalog:/app/catalog:ro
    depends_on:
      redis:
        condition: service_healthy

  clickhouse-sink:
    build: .
    command: python3 -m services.clickhouse_sink
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NORMALIZED_PRODUCTS_TOPIC: products.normalized
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: product_monitoring
      METRICS_PORT: 8003
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8003), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build: .
    command: uvicorn services.api:app --host 0.0.0.0 --port 8080
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: product_monitoring
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-sink:
        condition: service_healthy

  analyzer:
      build: .
      command: python3 -m analyzer.run_service
      restart: unless-stopped
      environment:
        CLICKHOUSE_HOST: clickhouse
        CLICKHOUSE_PORT: 8123
        CLICKHOUSE_USER: default
        CLICKHOUSE_PASSWORD: product_monitoring
        ANALYZER_INTERVAL_SECONDS: ${ANALYZER_INTERVAL_SECONDS:-3600}
        ANALYZER_OUTPUT_DIR: /app/report
      volumes:
        - ./report:/app/report
      depends_on:
        clickhouse:
          condition: service_healthy
        clickhouse-sink:
          condition: service_healthy

  scraper-lenta:
    <<: *scraper
    command: python3 -m scrapers.lenta

  scraper-podruzhka:
    <<: *scraper
    command: python3 -m scrapers.podruzhka

  scraper-rivegosh:
    <<: *scraper
    command: python3 -m scrapers.rivegosh

  scraper-iledebeaute:
    <<: *scraper
    command: python3 -m scrapers.iledebeaute

  scraper-mvideo:
    <<: *scraper
    command: python3 -m scrapers.mvideo

  scraper-citilink:
    <<: *scraper
    command: python3 -m scrapers.citilink

  scraper-holodilnik:
    <<: *scraper
    command: python3 -m scrapers.holodilnik

  scraper-magnit:
    <<: *scraper
    command: python3 -m scrapers.magnit

  scraper-pyaterochka:
    <<: *scraper
    command: python3 -m scrapers.pyaterochka

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

volumes:
  clickhouse_data:
  kafka_data:
  prometheus_data:
  redis_data:
